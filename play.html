<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>Secure Activity — Pawn to Professor</title>
  <link rel="stylesheet" href="./play.css" />
</head>
<body>
  <main class="player-shell" id="playerShell">
    <header class="player-bar" id="playerBar">
      <div class="player-title-block">
        <div class="kicker">PAWN TO PROFESSOR</div>
        <h1 id="playerTitle">Opening activity…</h1>
      </div>

      <div class="player-actions">
        <button id="backBtn" type="button" class="secondary">← Back</button>
        <button id="homeBtn" type="button" class="secondary">🏠 Home</button>
        <button id="guideBtn" type="button" class="secondary hidden">📘 How to Use</button>
        <button id="hideBarBtn" type="button" class="secondary">▲ Hide</button>
        <button id="retryBtn" type="button" class="hidden">Try again</button>
      </div>
    </header>

    <button id="showBarBtn" class="show-bar-tab hidden" type="button" aria-label="Show navigation menu">
      ▼ MENU
    </button>

    <section class="game-stage" id="gameStage">
      <iframe
        id="gameFrame"
        class="game-frame"
        title="Learning activity"
        allow="fullscreen; autoplay"
        referrerpolicy="no-referrer"
        loading="eager"
        fetchpriority="high"
      ></iframe>

      <div id="status" class="status-overlay" role="status" aria-live="polite">
        <div class="status-panel">
          <div class="spinner" aria-hidden="true"></div>
          <strong id="statusTitle">Checking your access…</strong>
          <span id="statusMessage">This secure link only works for an authorized account.</span>
          <div class="progress-track" aria-hidden="true"><div class="progress-bar"></div></div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./play.js" defer></script>
</body>
</html>
