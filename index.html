<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d6f4f" />
  <title>Pawn to Professor Learning Portal</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="scene" aria-label="Pawn to Professor learning portal">
    <section id="boardApp" class="board-shell" aria-live="polite">
      <div id="loadingView" class="center-card">
        <div class="spinner" aria-hidden="true"></div>
        <p>Loading classroom…</p>
      </div>

      <section id="loginView" class="view hidden">
        <div class="brand">
          <div class="brand-kicker">PAWN TO PROFESSOR</div>
          <h1>Learning Portal</h1>
          <p>Choose your class. Open your unit. Start learning.</p>
        </div>

        <form id="loginForm" class="login-card">
          <label>
            Username
            <input id="loginUsername" autocomplete="username" placeholder="teacher01" required />
          </label>
          <label>
            Password
            <input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••" required />
          </label>
          <button class="btn btn-primary" type="submit">Enter Classroom</button>
          <p id="loginMessage" class="form-message" role="alert"></p>
        </form>
      </section>

      <section id="portalView" class="view hidden">
        <header class="board-header">
          <div>
            <div class="brand-kicker">PAWN TO PROFESSOR</div>
            <h1 id="pageTitle">Learning Portal</h1>
          </div>
          <div class="header-actions">
            <button id="backBtn" class="btn btn-ghost hidden" type="button">← Back</button>
            <button id="adminBtn" class="btn btn-accent hidden" type="button">Admin</button>
            <button id="logoutBtn" class="btn btn-ghost" type="button">Log out</button>
          </div>
        </header>

        <div id="breadcrumb" class="breadcrumb"></div>
        <div id="contentArea" class="content-area"></div>
      </section>
    </section>
  </main>

  <template id="tileTemplate">
    <button class="menu-tile" type="button">
      <span class="tile-icon"></span>
      <span class="tile-title"></span>
      <span class="tile-subtitle"></span>
      <span class="lock-badge hidden">🔒</span>
    </button>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./app.js" defer></script>
</body>
</html>
